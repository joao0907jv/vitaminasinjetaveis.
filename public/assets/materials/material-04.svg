    <text x="160" y="355" font-family="system-ui, sans-serif" font-size="9" fill="#475569">50.000 UI</text>
    <text x="270" y="355" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Semanal ou mensal</text>
    <text x="350" y="355" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d9488">IM / SC</text>
  
    <rect x="20" y="364" width="380" height="22" fill="#ffffff" />
    <text x="30" y="379" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e293b">Deficiência moderada</text>
    <text x="160" y="379" font-family="system-ui, sans-serif" font-size="9" fill="#475569">50.000 a 100.000 UI</text>
    <text x="270" y="379" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Semanal ou mensal</text>
    <text x="350" y="379" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d9488">IM / SC</text>
  
    <rect x="20" y="388" width="380" height="22" fill="#f8fafc" />
    <text x="30" y="403" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e293b">Deficiência grave</text>
    <text x="160" y="403" font-family="system-ui, sans-serif" font-size="9" fill="#475569">100.000 a 200.000 UI</text>
    <text x="270" y="403" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Protocolo médico</text>
    <text x="350" y="403" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d9488">IM / SC</text>
  
    <rect x="20" y="412" width="380" height="22" fill="#ffffff" />
    <text x="30" y="427" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e293b">Manutenção</text>
    <text x="160" y="427" font-family="system-ui, sans-serif" font-size="9" fill="#475569">50.000 UI</text>
    <text x="270" y="427" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Mensal</text>
    <text x="350" y="427" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d9488">IM / SC</text>
  

  <!-- Section 4: Vias e Cuidados -->
  <rect x="20" y="450" width="185" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="466" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#0d9488">💉 VIAS DE APLICAÇÃO</text>
  <text x="28" y="482" font-family="system-ui, sans-serif" font-size="8" fill="#475569">IM ou Subcutânea profunda.</text>
  <text x="28" y="495" font-family="system-ui, sans-serif" font-size="8" fill="#475569"></text>

  <rect x="215" y="450" width="185" height="74" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="223" y="466" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#dc2626">⚠️ CUIDADOS & SEGURANÇA</text>
  <text x="223" y="482" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Monitorar cálcio sérico e urinário.</text>
  <text x="223" y="495" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d"> Atenção a doenças renais.</text>

  <!-- Bottom Notice -->
