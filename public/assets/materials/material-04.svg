  <text x="30" y="134" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0d9488">💡 O QUE É?</text>
  <text x="30" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#334155" width="360">Guia comparativo de formas D3 e D2 com protocolos clínicos de reposição e m</text>
  <text x="30" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#334155" width="360">anutenção em adultos.</text>

